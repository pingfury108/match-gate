[package]
name = "match-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "中文语义蕴含门禁 + 多候选项条件匹配（llama.cpp / GGUF，纯 CPU）"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["openmp"] }

[profile.release]
opt-level = 3
codegen-units = 16
